pid /tmp/nginx.pid;
error_log /dev/stderr error;

events {
  worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;

    # Temporary directories for Kubernetes readOnlyRootFilesystem
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Cache immutable hashed assets aggressively
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint for Kubernetes probes
        location /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # VitePress generates individual HTML files per route.
        # Fall back to the 404 page for missing paths.
        location / {
            try_files $uri $uri/ $uri.html /404.html =404;
        }
    }
}
